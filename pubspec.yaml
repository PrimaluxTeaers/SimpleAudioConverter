name: simple_audio_converter
description: "Audio converter for Android: 11 formats, continuous bitrate, batch. arm64-only, tuned for Android 17."
publish_to: 'none'

version: 1.1.0+7

environment:
  sdk: ^3.13.5

dependencies:
  ffmpeg_kit_flutter_new_audio: ^2.5.8
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  installed_apps: ^2.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  share_handler: ^0.0.25
  share_plus: ^13.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/arnndn-models/std.rnnn
    - assets/AppBar_Icon.png

flutter_launcher_icons:
  image_path: "metadata/en-US/images/icon.png"
  android: true
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "metadata/en-US/images/icon.png"
  adaptive_icon_foreground_inset: 18
