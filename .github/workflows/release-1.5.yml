name: Release 1.5

on:
  push:
    paths:
      - .github/workflows/release-1.5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: https://aka.doubaocdn.com/s/XRIQyTDsDY
      SOURCE_SHA256: 6fa9aa9a98202b533812dd5b37dd487429d0495a9447e0681d229afc5da6c81f
      APK_URL: https://aka.doubaocdn.com/s/LdyNNjs8Lj
      APK_SHA256: 2c458102f69332db4c32a674a752f58516967e180acec1921636b16f740264fd
      APK_FILE: dist/Timbre-1.5.0-arm64-v8a.apk
      REPO_DESCRIPTION: "Android + Windows audio converter: 18 formats, bitrate and level control, batch queue, SAF output. MPL-2.0 fork of TechnicJelle/SimpleAudioConverter. | 安卓/Windows 音频转码：18 种格式、码率与音量、批量与 SAF 输出。"
      REPO_HOMEPAGE: https://github.com/PrimaluxTeaers/SimpleAudioConverter/releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import 1.5 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/source.zip "$SOURCE_URL"
          echo "$SOURCE_SHA256  /tmp/source.zip" | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/. .
          git config user.name "PrimaluxTeaers"
          git config user.email "PrimaluxTeaers@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source already up to date."
          else
            git commit -m "release: Timbre 1.5.0 source"
            git push origin HEAD:main
          fi

      - name: Update repository metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description="$REPO_DESCRIPTION" -f homepage="$REPO_HOMEPAGE"
          echo "description_status=$?"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/topics" \
            -f 'names[]=android' -f 'names[]=windows' -f 'names[]=audio' \
            -f 'names[]=audio-converter' -f 'names[]=transcoding' \
            -f 'names[]=ffmpeg' -f 'names[]=mp3' -f 'names[]=opus' \
            -f 'names[]=aac' -f 'names[]=flac' -f 'names[]=flutter' \
            -f 'names[]=dart' -f 'names[]=mpl-2.0'
          echo "topics_status=$?"

      - name: Download and verify APK
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 -o "$APK_FILE" "$APK_URL"
          echo "$APK_SHA256  $APK_FILE" | sha256sum -c -
          ls -lh "$APK_FILE"

      - name: Publish Android and Windows markers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin windows-port || true
          if git rev-parse --verify origin/windows-port >/dev/null 2>&1; then
            WINDOWS_SHA=$(git rev-parse origin/windows-port)
          else
            WINDOWS_SHA=$(git rev-parse HEAD)
          fi

          if gh release view android-v1.5.0 >/dev/null 2>&1; then
            gh release upload android-v1.5.0 "$APK_FILE" --clobber
          else
            gh release create android-v1.5.0 "$APK_FILE" \
              --title "Timbre 1.5.0 — Android arm64-v8a" \
              --notes-file RELEASE_NOTES_ANDROID.md
          fi

          if gh release view windows-v1.5.0 >/dev/null 2>&1; then
            echo "windows-v1.5.0 already exists."
          else
            gh release create windows-v1.5.0 \
              --target "$WINDOWS_SHA" \
              --title "Timbre 1.5.0 — Windows support marker" \
              --prerelease \
              --notes-file RELEASE_NOTES_WINDOWS.md
          fi

          {
            echo "## Release result"
            echo "- Android: https://github.com/$GITHUB_REPOSITORY/releases/tag/android-v1.5.0"
            echo "- Windows: https://github.com/$GITHUB_REPOSITORY/releases/tag/windows-v1.5.0"
            echo "- APK SHA-256: \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
