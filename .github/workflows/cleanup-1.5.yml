name: Cleanup 1.5 release

on:
  push:
    paths:
      - .github/workflows/cleanup-1.5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove 1.5 releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release delete android-v1.5.0 --yes --delete-tag
          gh release delete windows-v1.5.0 --yes --delete-tag
          git push origin :refs/tags/android-v1.5.0
          git push origin :refs/tags/windows-v1.5.0
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/android-v1.5.0"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/windows-v1.5.0"
          echo "done"
