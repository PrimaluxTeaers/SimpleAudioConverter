name: sync-docs

on:
  push:
    paths:
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and commit bilingual docs
        env:
          README_URL: https://aka.doubaocdn.com/s/Oh5iDYLZ7n
          CHANGES_URL: https://aka.doubaocdn.com/s/lGoUBdOSlp
          ANDROID_URL: https://aka.doubaocdn.com/s/BNMdMLHVRc
          WINDOWS_URL: https://aka.doubaocdn.com/s/u0LSIFAiKJ
        run: |
          set -e
          curl -fsSL "$README_URL" -o README.md
          curl -fsSL "$CHANGES_URL" -o CHANGES.md
          curl -fsSL "$ANDROID_URL" -o RELEASE_NOTES_ANDROID.md
          curl -fsSL "$WINDOWS_URL" -o RELEASE_NOTES_WINDOWS.md
          git rm --ignore-unmatch README.en.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGES.md RELEASE_NOTES_ANDROID.md RELEASE_NOTES_WINDOWS.md
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "docs: sync bilingual 1.5 rework copy"
          git push
