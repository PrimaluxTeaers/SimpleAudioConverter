name: Verify release assets

on:
  push:
    paths:
      - .github/workflows/verify-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.6.0 -p Timbre-AndroidARM64-v8a-1.6.0.apk -O /tmp/release.apk --clobber
          sha256sum /tmp/release.apk > release-status.txt
          stat -c%s /tmp/release.apk >> release-status.txt
          gh api repos/PrimaluxTeaers/SimpleAudioConverter/releases/tags/v1.6.0 --jq '.assets[] | "ASSET \(.name) \(.size) \(.updated_at)"' >> release-status.txt
      - name: Commit status and remove workflow
        run: |
          git config user.name Teacers
          git config user.email teacers@users.noreply.github.com
          git add release-status.txt .github/workflows/verify-release.yml
          git commit -m 'docs: record release asset checksums'
          git rm .github/workflows/verify-release.yml
          git commit --amend --no-edit
          git push
