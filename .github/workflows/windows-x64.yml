name: Windows x64

# Builds the Timbre Windows package on a real Windows runner. The `windows/`
# project files are generated here because Flutter can only scaffold them with
# the platform toolchain present. FFmpegKit downloads its prebuilt FFmpeg 8.1.2
# DLLs into the build tree on first build, so nothing binary lives in the repo.

on:
  workflow_dispatch:
  push:
    branches:
      - windows-port
      - main
    paths:
      - "lib/**"
      - ".github/workflows/windows-x64.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: bash
        run: |
          flutter --version
          flutter config --enable-windows-desktop

      - name: Generate Windows runner
        shell: bash
        run: flutter create --platforms=windows --project-name simple_audio_converter .

      - name: Resolve packages
        shell: bash
        run: flutter pub get

      - name: Apply the Timbre icon
        shell: pwsh
        run: |
          Copy-Item "assets/app-icons/timbre.ico" "windows/runner/resources/app_icon.ico" -Force
          Get-Item "windows/runner/resources/app_icon.ico" | Select-Object Name, Length

      - name: Set desktop window title and size
        shell: pwsh
        run: |
          $main = "windows/runner/main.cpp"
          $text = Get-Content $main -Raw
          $text = $text -replace 'Win32Window::Size size\(1280, 720\);', 'Win32Window::Size size(1180, 820);'
          $text = $text -replace 'window\.Create\(L"simple_audio_converter"', 'window.Create(L"Timbre"'
          Set-Content $main $text -NoNewline

          $rc = "windows/runner/Runner.rc"
          $rcText = Get-Content $rc -Raw
          $rcText = $rcText -replace 'VALUE "FileDescription", "simple_audio_converter"', 'VALUE "FileDescription", "Timbre"'
          $rcText = $rcText -replace 'VALUE "ProductName", "simple_audio_converter"', 'VALUE "ProductName", "Timbre"'
          Set-Content $rc $rcText -NoNewline

      - name: Build release
        shell: bash
        run: flutter build windows --release

      - name: Inspect output
        shell: pwsh
        run: Get-ChildItem "build/windows/x64/runner/Release" | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "Timbre-WindowsX86-64-1.6.0.zip" -Force
          Get-Item "Timbre-WindowsX86-64-1.6.0.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Timbre-WindowsX86-64-1.6.0
          path: Timbre-WindowsX86-64-1.6.0.zip
          retention-days: 30

      - name: Replace the 1.6.0 Windows asset
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-port'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.6.0
          gh release upload v1.6.0 "Timbre-WindowsX86-64-1.6.0.zip" --clobber
