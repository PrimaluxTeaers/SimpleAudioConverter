name: Unpack 1.3.2 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-source.yml'
      - 'source-1.3.2.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.repository == 'Teacers/SimpleAudioConverter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack snapshot
        run: |
          unzip -o source-1.3.2.zip -x 'README.md' 'README.en.md' 'CHANGES.md' 'DEVLOG.md' 'THIRD_PARTY.md' 'metadata/*' '.github/*' -d .
      - name: Commit unpacked source
        run: |
          git config user.name 'Teacers'
          git config user.email '13314702071@163.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: unpack 1.3.2 source snapshot'
          git push
