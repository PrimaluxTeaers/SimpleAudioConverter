name: Cleanup 1.5 drafts

on:
  push:
    paths:
      - .github/workflows/cleanup-1.5-drafts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete 1.5 draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/447218234"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/447218364"
          echo "done"
